# Debian's default mod_deflate list leaves out JSON, so REST responses (the
# map endpoint is ~450 KB for 1,700 restaurants, ~40 KB gzipped) went out
# uncompressed. Production needs the same: see docs/plugins.md (W3 Total Cache).
<IfModule mod_deflate.c>
	AddOutputFilterByType DEFLATE application/json application/geo+json
</IfModule>
