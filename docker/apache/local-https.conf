# Local HTTPS on port 443 (published as WP_HTTPS_PORT, default 8443). Off until `make https`
# writes a certificate signed by a local authority you trust once in Firefox (README).
<IfFile /etc/guam-restaurants-certs/localhost.crt>
	<IfModule !ssl_module>
		LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
	</IfModule>
	<IfModule !socache_shmcb_module>
		LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
	</IfModule>
	Listen 443
	SSLSessionCache shmcb:/var/run/apache2/ssl_scache(512000)
	<VirtualHost *:443>
		DocumentRoot /var/www/html
		SSLEngine on
		SSLCertificateFile /etc/guam-restaurants-certs/localhost.crt
		SSLCertificateKeyFile /etc/guam-restaurants-certs/localhost.key
	</VirtualHost>
</IfFile>
